    - generic [ref=f32e26]:
      - paragraph [ref=f32e27]: Rooted in the timeless Gurukulam tradition and the Kalakshetra bani, our curriculum has been thoughtfully designed to guide every student through a structured progression of technical excellence, artistic expression, theoretical understanding, and stage confidence.
      - paragraph [ref=f32e28]: Each level builds naturally upon the previous one, ensuring that students develop a strong foundation before progressing towards advanced repertoire and ultimately, the Arangetram.
    - generic [ref=f32e30]:
