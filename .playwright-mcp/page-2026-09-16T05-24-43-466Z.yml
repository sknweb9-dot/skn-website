      - heading "Introduction to the Arts" [level=2] [ref=f32e32]
      - paragraph [ref=f32e33]: Ages 3.5 – 6 years
      - generic [ref=f32e35]:
        - generic [ref=f32e36]:
          - paragraph [ref=f32e37]: A gentle and joyful introduction designed for young children to develop rhythm, coordination, concentration, confidence, and cultural values. Through Sanskrit shlokas, devotional themes, storytelling, creative movement, rhythm exercises, and expressive dance activities, children are introduced to Indian culture in an engaging and age-appropriate manner before beginning formal Bharatanatyam training.
          - paragraph [ref=f32e38]: Formal Bharatanatyam training begins from Level 1.
