    - generic [ref=f1e189]:
      - paragraph [ref=f1e190]: Who teaches here
      - list [ref=f1e191]:
        - listitem [ref=f1e192]:
          - generic [ref=f1e193]:
            - img "Sunitta Menghanaani" [ref=f1e194]
            - generic [ref=f1e195]:
              - heading "Sunitta Menghanaani" [level=3] [ref=f1e196]
              - paragraph [ref=f1e197]: Co-founder & Director
              - paragraph [ref=f1e198]: Sunitta Menghanaani, a profound Bharatanatyam artiste and teacher, hails from Pune, but has made her karmabhumi — Chennai. She began her journey into dance at the tender age of 3 under Smt Geeta Nair. The urge to follow her passion brought her down South and she graduated in Bharatanatyam from Kalakshetra Foundation, Rukmini Devi College of Fine Arts, Chennai. Sunitta started dissemination of her artistic knowledge with the firm belief that everyone can learn dance, and the only talent required is a talent to work hard.
          - list [ref=f1e199]:
            - listitem [ref=f1e200]: Graduate, Rukmini Devi College of Fine Arts, Kalakshetra Foundation
            - listitem [ref=f1e201]: M.F.A., Kalai Kaveri College of Fine Arts, Trichy
            - listitem [ref=f1e202]: Best Performer Award, Sri Parthasarathy Swamy Sabha
            - listitem [ref=f1e203]: Exemplar Award, Dorai Foundation, Chennai
    - generic [ref=f1e205]:
      - paragraph [ref=f1e206]: The progression
      - heading "From first shloka to Arangetram, in Chennai" [level=2] [ref=f1e207]
      - list [ref=f1e208]:
        - listitem [ref=f1e209]:
          - paragraph [ref=f1e210]: "00"
          - heading "Introductory Programme Introduction to the Arts" [level=3] [ref=f1e211]:
            - text: Introductory Programme
            - generic [ref=f1e212]: Introduction to the Arts
          - paragraph [ref=f1e213]: Ages 3.5 – 6 years
          - paragraph [ref=f1e214]: A gentle and joyful introduction designed for young children to develop rhythm, coordination, concentration, confidence, and cultural values. Through Sanskrit shlokas, devotional themes, storytelling, creative movement, rhythm exercises, and expressive dance activities, children are introduced to Indian culture in an engaging and age-appropriate manner before beginning formal Bharatanatyam training.
        - listitem [ref=f1e215]:
          - paragraph [ref=f1e216]: "01"
          - heading "Level 1 Foundation" [level=3] [ref=f1e217]:
            - text: Level 1
            - generic [ref=f1e218]: Foundation
          - paragraph [ref=f1e219]: Students establish a strong technical foundation through basic Adavus, Hastas, rhythm training, introductory theory, and devotional compositions such as Mallari and Nottuswaram.
        - listitem [ref=f1e220]:
          - paragraph [ref=f1e221]: "02"
          - heading "Level 2 Technique Development" [level=3] [ref=f1e222]:
            - text: Level 2
            - generic [ref=f1e223]: Technique Development
          - paragraph [ref=f1e224]: Building strength, precision, and coordination through advanced Adavus while expanding theoretical knowledge and introducing traditional repertoire including Kauthuvam and Todayamangalam.
        - listitem [ref=f1e225]:
          - paragraph [ref=f1e226]: "03"
          - heading "Level 3 Margam Preparation" [level=3] [ref=f1e227]:
            - text: Level 3
            - generic [ref=f1e228]: Margam Preparation
          - paragraph [ref=f1e229]: Students begin their journey into the classical Margam, learning foundational performance pieces such as Alarippu, while continuing to strengthen technique and musical understanding through Tevaram and Divya Prabandham.
        - listitem [ref=f1e230]:
          - paragraph [ref=f1e231]: "04"
          - heading "Level 4 Repertoire & Expression" [level=3] [ref=f1e232]:
            - text: Level 4
            - generic [ref=f1e233]: Repertoire & Expression
          - paragraph [ref=f1e234]: Students expand their artistic vocabulary through Jatiswaram, Shabdam, Keerthanam, and Virutham, while developing expressive storytelling, abhinaya, and a deeper appreciation of Bharatanatyam's cultural heritage.
        - listitem [ref=f1e235]:
          - paragraph [ref=f1e236]: "05"
          - heading "Level 5 Advanced Artistry" [level=3] [ref=f1e237]:
            - text: Level 5
            - generic [ref=f1e238]: Advanced Artistry
          - paragraph [ref=f1e239]: Technical excellence is refined through Thillana, Ashtapadi, Bhajan, and Javali, alongside advanced study of theory, literature, composers, and expressive interpretation.
        - listitem [ref=f1e240]:
          - paragraph [ref=f1e241]: "06"
          - heading "Level 6 Mastery" [level=3] [ref=f1e242]:
            - text: Level 6
            - generic [ref=f1e243]: Mastery
          - paragraph [ref=f1e244]: The final academic level focuses on the most demanding elements of the Bharatanatyam repertoire, including Varnam, Padam, and Swarajathi, cultivating technical maturity, artistic excellence, and independent performance ability.
      - link "The full curriculum" [ref=f1e246] [cursor=pointer]:
        - /url: /curriculum
        - text: The full curriculum
        - generic [aria-hidden] [ref=f1e247]: →
    - generic [ref=f1e249]:
      - paragraph [ref=f1e250]: Chennai · Questions
      - generic [ref=f1e251]:
        - generic [ref=f1e252]:
          - term [ref=f1e253]: Where is your Bharatanatyam class in Chennai?
          - definition [ref=f1e254]: "We teach at 5 venues across Chennai: Appswamy Springs (Thiruvanmiyur), Adroit (Sholinganallur), Prestige Courtyards (Sholinganallur), Casagrand Riviera (Medavakkam), Casagrand Tranquil (Medavakkam). Our registered address is 11018, Ground Floor, Tower 11, Prestige Courtyard, Model School Extension Road, Sholinganallur, Chennai 600119."
        - generic [ref=f1e255]:
          - term [ref=f1e256]: Which areas around Chennai do your students come from?
          - definition [ref=f1e257]: We hold classes in Thiruvanmiyur, Sholinganallur, Medavakkam. Students also travel to us from Perungudi, Thoraipakkam, Karapakkam, Navalur, Siruseri, Velachery, Adyar, Pallikaranai, Kelambakkam, Egattur — those are catchment neighbourhoods rather than venues.
        - generic [ref=f1e258]:
          - term [ref=f1e259]: What style of Bharatanatyam is taught in Chennai?
          - definition [ref=f1e260]: The Kalakshetra style of Bharatanatyam, taught through the Gurukulam method — identical to our founding school in Chennai, under Smt. Sunitta Menghanaani.
        - generic [ref=f1e261]:
          - term [ref=f1e262]: Can my child start Bharatanatyam in Chennai with no experience?
          - definition [ref=f1e263]: Yes. Our Introductory Programme assumes nothing at all and takes children from age 3.5, and adults are welcome as beginners too. Bring comfortable clothes to a trial — no costume and no ghungroo needed.
