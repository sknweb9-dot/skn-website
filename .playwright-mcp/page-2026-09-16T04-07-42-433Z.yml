    - generic [ref=f5e108]:
      - paragraph [ref=f5e109]: The progression
      - heading "From first shloka to Arangetram, in Scarborough" [level=2] [ref=f5e110]
      - list [ref=f5e111]:
        - listitem [ref=f5e112]:
          - paragraph [ref=f5e113]: "00"
          - heading "Introductory Programme Introduction to the Arts" [level=3] [ref=f5e114]:
            - text: Introductory Programme
            - generic [ref=f5e115]: Introduction to the Arts
          - paragraph [ref=f5e116]: Ages 3.5 – 6 years
          - paragraph [ref=f5e117]: A gentle and joyful introduction designed for young children to develop rhythm, coordination, concentration, confidence, and cultural values. Through Sanskrit shlokas, devotional themes, storytelling, creative movement, rhythm exercises, and expressive dance activities, children are introduced to Indian culture in an engaging and age-appropriate manner before beginning formal Bharatanatyam training.
        - listitem [ref=f5e118]:
          - paragraph [ref=f5e119]: "01"
          - heading "Level 1 Foundation" [level=3] [ref=f5e120]:
            - text: Level 1
            - generic [ref=f5e121]: Foundation
          - paragraph [ref=f5e122]: Students establish a strong technical foundation through basic Adavus, Hastas, rhythm training, introductory theory, and devotional compositions such as Mallari and Nottuswaram.
        - listitem [ref=f5e123]:
          - paragraph [ref=f5e124]: "02"
          - heading "Level 2 Technique Development" [level=3] [ref=f5e125]:
            - text: Level 2
            - generic [ref=f5e126]: Technique Development
          - paragraph [ref=f5e127]: Building strength, precision, and coordination through advanced Adavus while expanding theoretical knowledge and introducing traditional repertoire including Kauthuvam and Todayamangalam.
        - listitem [ref=f5e128]:
          - paragraph [ref=f5e129]: "03"
          - heading "Level 3 Margam Preparation" [level=3] [ref=f5e130]:
            - text: Level 3
            - generic [ref=f5e131]: Margam Preparation
          - paragraph [ref=f5e132]: Students begin their journey into the classical Margam, learning foundational performance pieces such as Alarippu, while continuing to strengthen technique and musical understanding through Tevaram and Divya Prabandham.
        - listitem [ref=f5e133]:
          - paragraph [ref=f5e134]: "04"
          - heading "Level 4 Repertoire & Expression" [level=3] [ref=f5e135]:
            - text: Level 4
            - generic [ref=f5e136]: Repertoire & Expression
          - paragraph [ref=f5e137]: Students expand their artistic vocabulary through Jatiswaram, Shabdam, Keerthanam, and Virutham, while developing expressive storytelling, abhinaya, and a deeper appreciation of Bharatanatyam's cultural heritage.
        - listitem [ref=f5e138]:
          - paragraph [ref=f5e139]: "05"
          - heading "Level 5 Advanced Artistry" [level=3] [ref=f5e140]:
            - text: Level 5
            - generic [ref=f5e141]: Advanced Artistry
          - paragraph [ref=f5e142]: Technical excellence is refined through Thillana, Ashtapadi, Bhajan, and Javali, alongside advanced study of theory, literature, composers, and expressive interpretation.
        - listitem [ref=f5e143]:
          - paragraph [ref=f5e144]: "06"
          - heading "Level 6 Mastery" [level=3] [ref=f5e145]:
            - text: Level 6
            - generic [ref=f5e146]: Mastery
          - paragraph [ref=f5e147]: The final academic level focuses on the most demanding elements of the Bharatanatyam repertoire, including Varnam, Padam, and Swarajathi, cultivating technical maturity, artistic excellence, and independent performance ability.
      - link "The full curriculum" [ref=f5e149] [cursor=pointer]:
        - /url: /curriculum
        - text: The full curriculum
