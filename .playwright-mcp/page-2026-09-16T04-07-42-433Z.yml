    - generic [ref=f5e152]:
      - paragraph [ref=f5e153]: Scarborough · Questions
      - generic [ref=f5e154]:
        - generic [ref=f5e155]:
          - term [ref=f5e156]: Where is your Bharatanatyam class in Scarborough?
          - definition [ref=f5e157]: We teach in Scarborough at Morningside & Finch. Write to shantikalanikketan@gmail.com for the current venue and batch timings.
        - generic [ref=f5e158]:
          - term [ref=f5e159]: Which areas around Scarborough do your students come from?
          - definition [ref=f5e160]: We hold classes in Morningside & Finch. Students also travel to us from Scarborough, Malvern, Morningside Heights, Markham, Pickering, Ajax, North York, Greater Toronto Area — those are catchment neighbourhoods rather than venues.
        - generic [ref=f5e161]:
          - term [ref=f5e162]: What style of Bharatanatyam is taught in Scarborough?
          - definition [ref=f5e163]: The Kalakshetra style of Bharatanatyam, taught through the Gurukulam method — identical to our founding school in Chennai, under S. Kirusanthini.
        - generic [ref=f5e164]:
          - term [ref=f5e165]: Can my child start Bharatanatyam in Scarborough with no experience?
          - definition [ref=f5e166]: Yes. Our Introductory Programme assumes nothing at all and takes children from age 3.5, and adults are welcome as beginners too. Bring comfortable clothes to a trial — no costume and no ghungroo needed.
